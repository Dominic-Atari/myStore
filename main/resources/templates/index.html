<head>
  <link rel="stylesheet" type="text/css" th:href="@{/css/index-styles.css}">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>



<script type="text/javascript" th:src="@{/js/style-index.js}"></script>  

<script type="text/javascript">
//Get the search input field and search results container
const searchInput = document.getElementById('recipient-search');
const searchResultsContainer = document.getElementById('search-results');

// Add event listener to search input field
searchInput.addEventListener('input', function() {
  const searchQuery = searchInput.value.trim();
  if (searchQuery !== '') {
    // Send AJAX request to backend to search for recipients
    fetch('/search-recipients', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ query: searchQuery })
    })
    .then(response => response.json())
    .then(data => {
      // Display search results
      const searchResultsHtml = data.map(recipient => `
        <div class="search-result" data-id="${recipient.id}">
          <img src="${recipient.profilePicture}" alt="${recipient.firstName} ${recipient.lastName}">
          <span>${recipient.firstName} ${recipient.lastName}</span>
        </div>
      `).join('');
      searchResultsContainer.innerHTML = searchResultsHtml;

      // Add event listener to search results
      const searchResults = document.getElementsByClassName('search-result');
      Array.from(searchResults).forEach(result => {
        result.addEventListener('click', function() {
          const recipientId = result.getAttribute('data-id');
          document.getElementById('recipient-id').value = recipientId;
          searchResultsContainer.innerHTML = '';
          searchInput.value = result.querySelector('span').textContent;
        });
      });
    })
    .catch(error => console.error(error));
  } else {
    searchResultsContainer.innerHTML = '';
  }
});
</script>
