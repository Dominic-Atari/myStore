<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Best store</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
	crossorigin="anonymous">
	
	<style>
    body {
    background-image: linear-gradient(to left, rgba(0, 0, 139, 0.7), rgba(0, 0, 139, 2)), url('/images/background.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;


}
</style>
	
	
</head>
<body>
	<nav class="navbar navbar-expand-lg bg-light">
		<div class="container">
			<a class="navbar-brand" href="/">Best Store</a>
			<button class="navbar-toggler" type="button"
				data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
				aria-controls="navbarSupportedContent" aria-expanded="false"
				aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarSupportedContent">
				<ul class="navbar-nav me-auto mb-2 mb-lg-0">
					<li class="nav-item"><a class="nav-link text-dark" href="/">Home</a>
					</li>
					<li class="nav-item"><a class="nav-link text-dark"
						href="/contact">Contact</a></li>

				</ul>

				<ul class="navbar-nav me-3" sec:authorize="isAuthenticated">
    <li class="nav-item dropdown">
        <a class="nav-link dropdown-toggle text-dark" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            User
        </a>
        
        
        
        
        <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="/profile">Profile</a></li>
            <li><a class="dropdown-item" href="/settings">Settings</a></li>
            <li><a class="dropdown-item" href="/score">Score</a></li>
            <li><a class="dropdown-item" href="/grading">Grading</a></li>
        </ul>
    </li>
</ul>


				<form sec:authorize="isAuthenticated()" method="post" action="/logout">
				<input type="hidden" th:name="${_csrf.parameterName}"
				th:value="${_csrf.token}" />
				
				<button type="submit" class="btn btn-danger">
					Logout
				</button>
				
				
				</form>

				<ul class="navbar-nav" sec:authorize="!isAuthenticated()">
					<li class="nav-item"><a href="/register"
						class="btn btn-outline-primary me-2">Register</a></li>
					<li class="nav-item"><a href="/login" class="btn btn-primary">Login</a>
					</li>
				</ul>
			</div>
		</div>
	</nav>
	<div class="container py-5">
		<h1 class="text-primary">Hello, world!.</h1>
	</div>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
		crossorigin="anonymous"></script>
</body>
</html>
